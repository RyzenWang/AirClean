name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is pinned to 22.04 so CI tests the same glibc floor the AOT release ships.
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AirClean.sln

      - name: Build
        run: dotnet build AirClean.sln -c Release --no-restore

      - name: Test
        run: dotnet test AirClean.sln -c Release --no-build --logger "console;verbosity=normal"

      # AOT/trimming failures are silent: a dropped reflection path can leave settings or
      # rules empty while the app otherwise starts. Gate the native build on every PR.
      - name: Check AOT build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = dotnet publish src/AirClean.App/AirClean.App.csproj `
            -c Release `
            -r win-x64 `
            -p:PublishAot=true `
            -p:StripSymbols=true `
            -o publish/aot-check 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0) { throw "AOT publish failed with exit code $code." }

          $warnings = @($output | Select-String -Pattern 'warning IL\d{4}')
          if ($warnings.Count -gt 0) {
            $warnings | ForEach-Object { Write-Output $_.Line }
            throw "AOT produced $($warnings.Count) IL warning(s): a reflection path came back."
          }

          $exe = 'publish/aot-check/AirClean.exe'
          if (-not (Test-Path $exe)) { throw 'The AOT publish output has no AirClean.exe.' }
          $mb = ((Get-ChildItem publish/aot-check -Recurse -File | Measure-Object Length -Sum).Sum) / 1MB
          if ($mb -gt 90) { throw ('AOT output is {0:N0} MB; that is far above the expected ~42 MB.' -f $mb) }

          ('AOT Windows build: {0:N1} MB over {1} files, no IL warnings.' -f $mb, (Get-ChildItem publish/aot-check -Recurse -File).Count) >> $env:GITHUB_STEP_SUMMARY

      - name: Install AOT toolchain (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Check AOT build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          log=$(dotnet publish src/AirClean.App/AirClean.App.csproj \
            -c Release \
            -r linux-x64 \
            -p:PublishAot=true \
            -p:StripSymbols=true \
            -o publish/aot-check-linux 2>&1) || {
            echo "$log"
            echo "::error::AOT publish failed"
            exit 1
          }
          echo "$log"

          if echo "$log" | grep -Eq 'warning IL[0-9]{4}'; then
            echo "$log" | grep -E 'warning IL[0-9]{4}'
            echo "::error::AOT produced IL warnings: a reflection path came back."
            exit 1
          fi

          test -f publish/aot-check-linux/AirClean || {
            echo "::error::The AOT publish output has no AirClean binary."
            exit 1
          }

          mb=$(du -sm publish/aot-check-linux | cut -f1)
          if [ "$mb" -gt 90 ]; then
            echo "::error::AOT output is ${mb} MB, far above the expected ~42 MB."
            exit 1
          fi

          floor=$(objdump -T publish/aot-check-linux/AirClean | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "AOT Linux build: ${mb} MB, requires ${floor} at most." >> "$GITHUB_STEP_SUMMARY"
          max_allowed=2.35
          if [ "$(printf '%s\n' "$max_allowed" "${floor#GLIBC_}" | sort -V | tail -1)" != "$max_allowed" ]; then
            echo "::error::The binary requires ${floor}, above the supported ${max_allowed}."
            exit 1
          fi

      - name: Check AOT build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          log=$(dotnet publish src/AirClean.App/AirClean.App.csproj \
            -c Release \
            -r osx-arm64 \
            -p:PublishAot=true \
            -p:StripSymbols=true \
            -o publish/aot-check-osx 2>&1) || {
            echo "$log"
            echo "::error::AOT publish failed"
            exit 1
          }
          echo "$log"

          if echo "$log" | grep -Eq 'warning IL[0-9]{4}'; then
            echo "$log" | grep -E 'warning IL[0-9]{4}'
            echo "::error::AOT produced IL warnings: a reflection path came back."
            exit 1
          fi

          test -f publish/aot-check-osx/AirClean || {
            echo "::error::The AOT publish output has no AirClean binary."
            exit 1
          }

          mb=$(du -sm publish/aot-check-osx | cut -f1)
          if [ "$mb" -gt 90 ]; then
            echo "::error::AOT output is ${mb} MB, far above the expected ~42 MB."
            exit 1
          fi

          echo "AOT macOS arm64 build: ${mb} MB." >> "$GITHUB_STEP_SUMMARY"
