name: MFT check

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  mft:
    name: MFT scan on a Windows runner
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify elevation
        shell: pwsh
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]$identity
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw "The Windows runner is not elevated; raw NTFS access cannot be tested."
          }
          Write-Host "Running elevated as $($identity.Name)"

      - name: Run the direct MFT check
        shell: pwsh
        run: dotnet run --project tools/MftCheck/MftCheck.csproj -c Release

      - name: Build the app for the helper round-trip
        shell: pwsh
        run: dotnet build src/AirClean.App/AirClean.App.csproj -c Release

      - name: Run the elevated helper round-trip
        shell: pwsh
        run: |
          $app = (Resolve-Path "src/AirClean.App/bin/Release/net10.0/AirClean.exe").Path
          dotnet run --project tools/MftCheck/MftCheck.csproj -c Release -- --via-helper $app

      - name: Run the multi-command helper session
        shell: pwsh
        run: |
          $app = (Resolve-Path "src/AirClean.App/bin/Release/net10.0/AirClean.exe").Path
          dotnet run --project tools/MftCheck/MftCheck.csproj -c Release -- --session --via-helper $app

      - name: Seed an administrator-cleanup test file
        shell: pwsh
        run: |
          $directory = Join-Path $env:WINDIR "SoftwareDistribution\Download"
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          [IO.File]::WriteAllBytes(
            (Join-Path $directory "airclean-helper-check.bin"),
            (New-Object byte[] 4096))
          Write-Host "Seeded a 4 KB file in $directory"

      - name: Run the administrator scan round-trip
        shell: pwsh
        run: |
          $app = (Resolve-Path "src/AirClean.App/bin/Release/net10.0/AirClean.exe").Path
          dotnet run --project tools/MftCheck/MftCheck.csproj -c Release -- --admin-scan --via-helper $app

      - name: Run the administrator cleanup round-trip
        shell: pwsh
        run: |
          $app = (Resolve-Path "src/AirClean.App/bin/Release/net10.0/AirClean.exe").Path
          dotnet run --project tools/MftCheck/MftCheck.csproj -c Release -- --admin-clean --via-helper $app

      - name: Verify the seeded file was removed
        shell: pwsh
        run: |
          $file = Join-Path $env:WINDIR "SoftwareDistribution\Download\airclean-helper-check.bin"
          if (Test-Path -LiteralPath $file) {
            throw "The administrator cleanup did not remove the seeded file."
          }
          Write-Host "The seeded file was removed."
