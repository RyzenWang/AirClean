name: Release

# Two distribution lines:
#   Windows — a Microsoft Store package (.msix). The Store signs it, so no certificate
#             lives in this repository and nothing is withheld.
#   macOS / Linux — portable archives only, unzip and run.
on:
  push:
    tags:
      - "v*"
  # Manual run: builds and uploads artifacts without creating a release, so packaging
  # changes can be validated without tagging.
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    name: Windows (MSIX)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            "0.0.1-dev"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Publish (NativeAOT)
        shell: pwsh
        run: |
          $output = dotnet publish src/AirClean.App/AirClean.App.csproj `
            -c Release `
            -r win-x64 `
            -p:PublishAot=true `
            -p:StripSymbols=true `
            -p:Version=${{ steps.version.outputs.value }} `
            -o publish/win-x64 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0) { throw "AOT publish failed with exit code $code." }

          $warnings = @($output | Select-String -Pattern 'warning IL\d{4}')
          if ($warnings.Count -gt 0) {
            $warnings | ForEach-Object { Write-Output $_.Line }
            throw "AOT produced $($warnings.Count) IL warning(s); fix them before releasing."
          }

          $exe = 'publish/win-x64/AirClean.exe'
          if (-not (Test-Path $exe)) { throw 'The AOT publish output has no AirClean.exe.' }
          $mb = ((Get-ChildItem publish/win-x64 -Recurse -File | Measure-Object Length -Sum).Sum) / 1MB
          if ($mb -gt 90) { throw ('AOT output is {0:N0} MB; far above the expected ~42 MB.' -f $mb) }

          ('Windows: NativeAOT build is {0:N1} MB over {1} files, no IL warnings.' -f $mb, (Get-ChildItem publish/win-x64 -Recurse -File).Count) >> $env:GITHUB_STEP_SUMMARY

      - name: Build the Store package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          New-Item -ItemType Directory -Path releases/win -Force | Out-Null

          pwsh -NoProfile -ExecutionPolicy Bypass -File packaging/msix/Build-Msix.ps1 `
            -PublishDir publish/win-x64 `
            -Version $version `
            -Output "releases/win/AirClean-$version-win-x64.msix"
          if ($LASTEXITCODE -ne 0) { throw "MSIX packaging failed with exit code $LASTEXITCODE." }

          $msix = Get-Item "releases/win/AirClean-$version-win-x64.msix"
          ('Windows: MSIX is {0:N1} MB.' -f ($msix.Length / 1MB)) >> $env:GITHUB_STEP_SUMMARY

      - name: Package the portable archive
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          Compress-Archive -Path publish/win-x64/* `
            -DestinationPath "releases/win/AirClean-$version-win-x64-portable.zip" `
            -CompressionLevel Optimal

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AirClean-win-x64
          path: releases/win/*

  macos:
    name: macOS ${{ matrix.arch }} (portable)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
            arch: arm64
          - os: macos-15-intel
            rid: osx-x64
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.1-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (NativeAOT)
        shell: bash
        run: |
          set -o pipefail
          log=$(dotnet publish src/AirClean.App/AirClean.App.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            -p:PublishAot=true \
            -p:StripSymbols=true \
            -p:Version=${{ steps.version.outputs.value }} \
            -o publish/${{ matrix.rid }} 2>&1) || {
            echo "$log"
            echo "::error::AOT publish failed"
            exit 1
          }
          echo "$log"

          if echo "$log" | grep -Eq 'warning IL[0-9]{4}'; then
            echo "$log" | grep -E 'warning IL[0-9]{4}'
            echo "::error::AOT produced IL warnings; fix them before releasing."
            exit 1
          fi

          test -f "publish/${{ matrix.rid }}/AirClean" || {
            echo "::error::The AOT publish output has no AirClean binary."
            exit 1
          }

          mb=$(du -sm "publish/${{ matrix.rid }}" | cut -f1)
          if [ "$mb" -gt 90 ]; then
            echo "::error::AOT output is ${mb} MB, far above the expected ~42 MB."
            exit 1
          fi

          echo "macOS ${{ matrix.arch }}: NativeAOT build is ${mb} MB over $(find "publish/${{ matrix.rid }}" -type f | wc -l) files, no IL warnings." >> "$GITHUB_STEP_SUMMARY"

      - name: Package the portable archive
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          mkdir -p "releases/osx-${{ matrix.arch }}"
          # zip keeps the executable bit on the binary, so the archive is runnable after
          # unzipping without a chmod.
          (cd "publish/${{ matrix.rid }}" &&
            zip -qry "../../releases/osx-${{ matrix.arch }}/AirClean-${version}-osx-${{ matrix.arch }}-portable.zip" .)

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AirClean-osx-${{ matrix.arch }}
          path: releases/osx-${{ matrix.arch }}/*

  linux:
    name: Linux portable
    # NativeAOT links against the build machine's glibc. ubuntu-latest (24.04) would
    # require GLIBC_2.38 and fail on Ubuntu 22.04; pin the oldest supported runner.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.1-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Install AOT toolchain
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish (NativeAOT)
        shell: bash
        run: |
          set -o pipefail
          log=$(dotnet publish src/AirClean.App/AirClean.App.csproj \
            -c Release \
            -r linux-x64 \
            -p:PublishAot=true \
            -p:StripSymbols=true \
            -p:Version=${{ steps.version.outputs.value }} \
            -o publish/linux-x64 2>&1) || {
            echo "$log"
            echo "::error::AOT publish failed"
            exit 1
          }
          echo "$log"

          if echo "$log" | grep -Eq 'warning IL[0-9]{4}'; then
            echo "$log" | grep -E 'warning IL[0-9]{4}'
            echo "::error::AOT produced IL warnings; fix them before releasing."
            exit 1
          fi

          test -f publish/linux-x64/AirClean || {
            echo "::error::The AOT publish output has no AirClean binary."
            exit 1
          }

          mb=$(du -sm publish/linux-x64 | cut -f1)
          if [ "$mb" -gt 90 ]; then
            echo "::error::AOT output is ${mb} MB, far above the expected ~42 MB."
            exit 1
          fi

          floor=$(objdump -T publish/linux-x64/AirClean | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "Linux: NativeAOT build is ${mb} MB, requires ${floor} at most." >> "$GITHUB_STEP_SUMMARY"
          max_allowed=2.35
          if [ "$(printf '%s\n' "$max_allowed" "${floor#GLIBC_}" | sort -V | tail -1)" != "$max_allowed" ]; then
            echo "::error::The binary requires ${floor}, above the supported ${max_allowed}."
            exit 1
          fi

      - name: Package the portable archive
        shell: bash
        run: |
          # Ship the desktop entry and icon next to the binary so a Linux install is not
          # just an executable in a folder. The tar layout stays flat: AirClean,
          # AirClean.desktop, airclean.png and the native libraries.
          mkdir -p staging
          cp -r publish/linux-x64/. staging/
          cp packaging/linux/AirClean.desktop staging/
          cp src/AirClean.App/Assets/airclean.png staging/
          tar -czf "AirClean-${{ steps.version.outputs.value }}-linux-x64.tar.gz" -C staging .
          rm -rf staging

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirClean-linux-x64
          path: AirClean-*-linux-x64.tar.gz

  release:
    name: Create GitHub release
    needs: [windows, macos, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compose the release notes
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { capturing = 1; next }
            capturing && $0 ~ "^## \\[" { exit }
            capturing { print }
          ' CHANGELOG.md > release-notes.raw

          # Trim the blank lines that surround the section so the body starts and ends clean.
          awk '
            { lines[NR] = $0; if ($0 != "") { last = NR } }
            END {
              first = 1
              while (first <= last && lines[first] == "") { first++ }
              for (i = first; i <= last; i++) { print lines[i] }
            }
          ' release-notes.raw > release-notes.md
          rm -f release-notes.raw

          if [ -s release-notes.md ]; then
            previous="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
            if [ -n "$previous" ]; then
              printf '\n\n**Full changelog**: https://github.com/%s/compare/%s...%s\n' \
                "$GITHUB_REPOSITORY" "$previous" "$GITHUB_REF_NAME" >> release-notes.md
            fi

            printf '\n### Install\n\nWindows: the Microsoft Store, or the `.msix` beside this release.\nmacOS and Linux: unzip the portable archive and run the binary; no installer, no signing.\n' >> release-notes.md

            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Publishing the CHANGELOG.md section for ${version}." >> "$GITHUB_STEP_SUMMARY"
          else
            rm -f release-notes.md
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No CHANGELOG entry::CHANGELOG.md has no '## [${version}]' section; falling back to generated notes."
          fi

          echo "Release payload:"
          find artifacts -type f -maxdepth 3 | sort

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: AirClean ${{ github.ref_name }}
          files: |
            artifacts/**/AirClean-*
            artifacts/**/releases.*.json
          # Prefer the hand-written entry; only fall back to generated notes when the
          # tag has no section, because generate_release_notes lists pull requests and
          # this repository commits straight to main.
          body_path: ${{ steps.notes.outputs.present == 'true' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.present != 'true' }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-preview') }}
