name: Release

on:
  push:
    tags:
      - "v*"
  # Manual run: builds and uploads artifacts without creating a release, so packaging
  # changes can be validated without tagging.
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  VPK_VERSION: 1.2.161

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            "0.0.1-dev"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Publish (NativeAOT)
        shell: pwsh
        run: |
          $output = dotnet publish src/AirClean.App/AirClean.App.csproj `
            -c Release `
            -r win-x64 `
            -p:PublishAot=true `
            -p:StripSymbols=true `
            -p:Version=${{ steps.version.outputs.value }} `
            -o publish/win-x64 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0) { throw "AOT publish failed with exit code $code." }

          $warnings = @($output | Select-String -Pattern 'warning IL\d{4}')
          if ($warnings.Count -gt 0) {
            $warnings | ForEach-Object { Write-Output $_.Line }
            throw "AOT produced $($warnings.Count) IL warning(s); fix them before releasing."
          }

          $exe = 'publish/win-x64/AirClean.exe'
          if (-not (Test-Path $exe)) { throw 'The AOT publish output has no AirClean.exe.' }
          $mb = ((Get-ChildItem publish/win-x64 -Recurse -File | Measure-Object Length -Sum).Sum) / 1MB
          if ($mb -gt 90) { throw ('AOT output is {0:N0} MB; far above the expected ~42 MB.' -f $mb) }

          ('Windows: NativeAOT build is {0:N1} MB over {1} files, no IL warnings.' -f $mb, (Get-ChildItem publish/win-x64 -Recurse -File).Count) >> $env:GITHUB_STEP_SUMMARY

      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install vpk --version $env:VPK_VERSION --tool-path .vpk

      - name: Prepare Windows certificate
        if: env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "airclean-codesign.pfx"
          [IO.File]::WriteAllBytes(
            $path,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          "WINDOWS_CERT_PATH=$path" >> $env:GITHUB_ENV

      - name: Build installer and portable package
        shell: pwsh
        run: |
          $args = @(
            "pack",
            "--packId", "AirClean",
            "--packVersion", "${{ steps.version.outputs.value }}",
            "--packDir", "publish/win-x64",
            "--mainExe", "AirClean.exe",
            "--packTitle", "AirClean",
            "--packAuthors", "AirClean contributors",
            "--icon", "src/AirClean.App/Assets/airclean.ico",
            "--runtime", "win-x64",
            "--channel", "win",
            "--outputDir", "releases/win"
          )

          if ($env:WINDOWS_CERT_PATH) {
            $sign = "/td sha256 /fd sha256 /f `"$env:WINDOWS_CERT_PATH`" /p `"$env:WINDOWS_CERTIFICATE_PASSWORD`" /tr http://timestamp.digicert.com"
            $args += @("--signParams", $sign)
          } else {
            Write-Host "::warning title=Unsigned build::No signing certificate configured; SmartScreen will warn."
          }

          & "$PWD\.vpk\vpk.exe" @args

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AirClean-win-x64
          path: releases/win/*

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
            arch: arm64
          - os: macos-15-intel
            rid: osx-x64
            arch: x64

    env:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_APP_SIGN_IDENTITY: ${{ secrets.MACOS_APP_SIGN_IDENTITY }}
      MACOS_INSTALLER_SIGN_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.1-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (NativeAOT)
        shell: bash
        run: |
          set -o pipefail
          log=$(dotnet publish src/AirClean.App/AirClean.App.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            -p:PublishAot=true \
            -p:StripSymbols=true \
            -p:Version=${{ steps.version.outputs.value }} \
            -o publish/${{ matrix.rid }} 2>&1) || {
            echo "$log"
            echo "::error::AOT publish failed"
            exit 1
          }
          echo "$log"

          if echo "$log" | grep -Eq 'warning IL[0-9]{4}'; then
            echo "$log" | grep -E 'warning IL[0-9]{4}'
            echo "::error::AOT produced IL warnings; fix them before releasing."
            exit 1
          fi

          test -f "publish/${{ matrix.rid }}/AirClean" || {
            echo "::error::The AOT publish output has no AirClean binary."
            exit 1
          }

          mb=$(du -sm "publish/${{ matrix.rid }}" | cut -f1)
          if [ "$mb" -gt 90 ]; then
            echo "::error::AOT output is ${mb} MB, far above the expected ~42 MB."
            exit 1
          fi

          echo "macOS ${{ matrix.arch }}: NativeAOT build is ${mb} MB over $(find "publish/${{ matrix.rid }}" -type f | wc -l) files, no IL warnings." >> "$GITHUB_STEP_SUMMARY"

      - name: Install Velopack CLI
        shell: bash
        run: dotnet tool install vpk --version "$VPK_VERSION" --tool-path .vpk

      - name: Import Apple certificate and notary profile
        if: env.MACOS_CERTIFICATE_BASE64 != ''
        shell: bash
        run: |
          CERT_PATH="$RUNNER_TEMP/airclean-app.p12"
          INSTALLER_PATH="$RUNNER_TEMP/airclean-installer.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/airclean-signing.keychain-db"

          python3 - "$CERT_PATH" "$MACOS_CERTIFICATE_BASE64" <<'PY'
          import base64, sys
          open(sys.argv[1], "wb").write(base64.b64decode(sys.argv[2]))
          PY
          python3 - "$INSTALLER_PATH" "$MACOS_INSTALLER_CERTIFICATE_BASE64" <<'PY'
          import base64, sys
          open(sys.argv[1], "wb").write(base64.b64decode(sys.argv[2]))
          PY

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import "$INSTALLER_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          xcrun notarytool store-credentials "airclean-notary" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build pkg and portable package
        shell: bash
        run: |
          args=(
            pack
            --packId "AirClean-osx-${{ matrix.arch }}"
            --packVersion "${{ steps.version.outputs.value }}"
            --packDir "publish/${{ matrix.rid }}"
            --mainExe AirClean
            --packTitle AirClean
            --packAuthors "AirClean contributors"
            --icon src/AirClean.App/Assets/airclean.icns
            --runtime "${{ matrix.rid }}"
            --channel "osx-${{ matrix.arch }}"
            --outputDir "releases/osx-${{ matrix.arch }}"
          )

          if [[ -n "${MACOS_CERTIFICATE_BASE64:-}" ]]; then
            args+=(
              --signAppIdentity "$MACOS_APP_SIGN_IDENTITY"
              --signInstallIdentity "$MACOS_INSTALLER_SIGN_IDENTITY"
              --notaryProfile airclean-notary
              --keychain "$KEYCHAIN_PATH"
            )
          else
            echo "::warning title=Unsigned build::No Apple certificate configured; Gatekeeper will block this package."
          fi

          ./.vpk/vpk "${args[@]}"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AirClean-osx-${{ matrix.arch }}
          path: releases/osx-${{ matrix.arch }}/*

  linux:
    name: Linux portable
    # NativeAOT links against the build machine's glibc. ubuntu-latest (24.04) would
    # require GLIBC_2.38 and fail on Ubuntu 22.04; pin the oldest supported runner.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.1-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Install AOT toolchain
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish (NativeAOT)
        shell: bash
        run: |
          set -o pipefail
          log=$(dotnet publish src/AirClean.App/AirClean.App.csproj \
            -c Release \
            -r linux-x64 \
            -p:PublishAot=true \
            -p:StripSymbols=true \
            -p:Version=${{ steps.version.outputs.value }} \
            -o publish/linux-x64 2>&1) || {
            echo "$log"
            echo "::error::AOT publish failed"
            exit 1
          }
          echo "$log"

          if echo "$log" | grep -Eq 'warning IL[0-9]{4}'; then
            echo "$log" | grep -E 'warning IL[0-9]{4}'
            echo "::error::AOT produced IL warnings; fix them before releasing."
            exit 1
          fi

          test -f publish/linux-x64/AirClean || {
            echo "::error::The AOT publish output has no AirClean binary."
            exit 1
          }

          mb=$(du -sm publish/linux-x64 | cut -f1)
          if [ "$mb" -gt 90 ]; then
            echo "::error::AOT output is ${mb} MB, far above the expected ~42 MB."
            exit 1
          fi

          floor=$(objdump -T publish/linux-x64/AirClean | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "Linux: NativeAOT build is ${mb} MB, requires ${floor} at most." >> "$GITHUB_STEP_SUMMARY"
          max_allowed=2.35
          if [ "$(printf '%s\n' "$max_allowed" "${floor#GLIBC_}" | sort -V | tail -1)" != "$max_allowed" ]; then
            echo "::error::The binary requires ${floor}, above the supported ${max_allowed}."
            exit 1
          fi

      - name: Package
        shell: bash
        run: |
          tar -czf "AirClean-${{ steps.version.outputs.value }}-linux-x64.tar.gz" \
            -C publish/linux-x64 .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirClean-linux-x64
          path: AirClean-*-linux-x64.tar.gz

  release:
    name: Create GitHub release
    needs: [windows, macos, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Remove unsigned installers
        shell: bash
        run: |
          if [ -z "${WINDOWS_CERTIFICATE_BASE64:-}" ]; then
            echo "Windows signing is not configured; withholding AirClean-win-Setup.exe."
            find artifacts/AirClean-win-x64 -maxdepth 1 -type f -name 'AirClean-win-Setup.exe' -delete
          fi

          if [ -z "${MACOS_CERTIFICATE_BASE64:-}" ]; then
            echo "macOS signing is not configured; withholding the macOS Setup.pkg files."
            find artifacts -maxdepth 2 -type f -name '*-Setup.pkg' -delete
          fi

          echo "Release payload:"
          find artifacts -type f -maxdepth 3 | sort

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: AirClean ${{ github.ref_name }}
          files: |
            artifacts/**/AirClean-*
            artifacts/**/releases.*.json
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-preview') }}

      - name: Note withheld installers
        if: env.WINDOWS_CERTIFICATE_BASE64 == '' || env.MACOS_CERTIFICATE_BASE64 == ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body)

          if echo "$body" | grep -q 'Unsigned installers withheld'; then
            exit 0
          fi

          withheld=""
          if [ -z "${WINDOWS_CERTIFICATE_BASE64:-}" ]; then
            withheld="Windows Setup.exe"
          fi
          if [ -z "${MACOS_CERTIFICATE_BASE64:-}" ]; then
            withheld="${withheld:+$withheld / }macOS Setup.pkg"
          fi

          note="> **Unsigned installers withheld:** ${withheld}. Portable packages, nupkg files and update manifests are included; the withheld installers return once the matching signing secrets are configured."

          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --notes "$(printf '%s\n\n%s' "$body" "$note")"
